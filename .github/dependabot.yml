version: 2

updates:
  # Les actions épinglées sur une version majeure obsolète cassent
  # silencieusement (dépréciation des runners Node). Une PR groupée par mois
  # suffit à rester à jour sans bruit.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Mises à jour Gradle limitées aux versions mineures/correctives : un bump
  # majeur de Kotlin, AGP ou Compose Multiplatform demande une migration
  # manuelle sur ce projet (KSP, Room, Compose Compiler sont couplés).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
