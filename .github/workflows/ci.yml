name: CI

# Pipeline unique du dépôt : tests, compilation des cibles, puis empaquetage.
# Rien n'est empaqueté si les tests échouent — c'est le point du gating par
# `needs:`. L'ancien workflow build-deb.yml produisait un .deb même sur une
# branche cassée ; il a été absorbé par le job `package-deb` ci-dessous.

on:
  push:
    branches:
      - main
      - master
      - revetBackUp
      - 'claude/**'
    # Une modification uniquement documentaire ne justifie pas 40 min de CI.
    # Volontairement absent du déclencheur `pull_request` : un check requis
    # qui ne démarre jamais bloque la PR indéfiniment.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.cursor/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Compiler aussi la cible iOS (runner macOS, plus lent)"
        type: boolean
        default: false

concurrency:
  # Un nouveau push sur une branche de travail annule le run précédent ;
  # sur main on laisse chaque run aller au bout (il produit le .deb).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  # dorny/test-reporter publie un check avec le détail des tests JUnit.
  checks: write

env:
  # AppSecretsTest impose des clés non vides. On utilise les secrets du dépôt
  # s'ils sont configurés, sinon une valeur factice : ces tests vérifient que
  # l'injection build-time fonctionne, pas la validité de la clé jsonbin.
  JSONBIN_CREATE_KEY: ${{ secrets.JSONBIN_CREATE_KEY || 'ci-placeholder' }}
  JSONBIN_READ_KEY: ${{ secrets.JSONBIN_READ_KEY || 'ci-placeholder' }}
  GRADLE_OPTS: -Dorg.gradle.welcome=never

jobs:
  # ---------------------------------------------------------------------------
  # Retour rapide : les 60 fichiers de commonTest + les 16 de desktopTest, sans
  # passer par la chaîne Android (la plus lente). C'est le SEUL job qui exécute
  # les tests communs : build-android ne les rejoue plus (voir plus bas).
  #
  # Prochaine étape couverture : brancher Kover (plugin Gradle
  # `org.jetbrains.kotlinx.kover` dans composeApp/build.gradle.kts, puis
  # `koverXmlReport`/`koverHtmlReport` ici et un seuil `koverVerify`). Non fait
  # dans cette itération pour ne pas toucher au build Gradle.
  # ---------------------------------------------------------------------------
  tests-jvm:
    name: Tests JVM (common + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Indispensable : les PNG/ICO sont suivis par Git LFS (.gitattributes).
          # Sans ceci, composeApp/src/desktopMain/resources/icon.png arrive sous
          # forme de pointeur texte de 131 octets et l'empaquetage embarque une
          # icône invalide.
          lfs: true

      - name: Préparer le build
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ !contains(fromJSON('["main", "master", "revetBackUp"]'), github.ref_name) }}

      - name: Dépendances natives de Skiko
        # AppLogoDecoderTest décode un PNG via Skia : la bibliothèque native
        # skiko-linux-x64 réclame libGL et fontconfig, absents d'un runner nu.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libfontconfig1 libfreetype6

      - name: Tests desktop
        run: ./gradlew :composeApp:desktopTest --stacktrace

      - name: Vérifier que les schémas Room exportés sont à jour
        # 40 schémas (versions 1 et 3 à 41) sont versionnés dans
        # composeApp/schemas/. Si une entité
        # change sans que le schéma régénéré soit commité, les migrations
        # divergent du code et Room échoue au démarrage chez l'utilisateur.
        run: |
          # --porcelain (et non `git diff`) pour détecter aussi un schéma
          # nouvellement généré mais jamais ajouté à l'index.
          drift=$(git status --porcelain --untracked-files=all -- composeApp/schemas)
          if [ -n "$drift" ]; then
            echo "::error::Les schémas Room exportés ne correspondent plus aux entités."
            echo "Régénérez-les localement puis commitez composeApp/schemas/ :"
            echo "  ./gradlew :composeApp:desktopTest && git add composeApp/schemas/"
            echo "$drift"
            exit 1
          fi
          echo "Schémas Room à jour."

      - name: Archiver les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-jvm
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Résumé des tests (JUnit XML)
        # Rend les échecs lisibles dans l'onglet Checks / le résumé du job sans
        # ouvrir l'artefact. `permissions: checks: write` est nécessaire pour
        # publier un check ; sur une PR venant d'un fork il n'écrit que le résumé.
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Tests JVM — résultats
          path: composeApp/build/test-results/desktopTest/*.xml
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # Analyse statique Kotlin (detekt) via le jar CLI, sans plugin Gradle : le
  # build n'est pas modifié. RAPPORT SEULEMENT pour l'instant (continue-on-error
  # + maxIssues: -1 dans detekt.yml) : le nombre d'écarts de la base de code
  # n'est pas encore connu. Une fois le premier rapport lu, fixer le seuil dans
  # detekt.yml (ou générer une baseline) et retirer `continue-on-error`.
  # ---------------------------------------------------------------------------
  detekt:
    name: Analyse statique (detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DETEKT_VERSION: 1.23.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Télécharger detekt-cli ${{ env.DETEKT_VERSION }}
        run: |
          curl -sSL --fail -o detekt-cli.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          unzip -q detekt-cli.zip -d detekt-dist
          chmod +x "detekt-dist/detekt-cli-${DETEKT_VERSION}/bin/detekt-cli"

      - name: Exécuter detekt
        continue-on-error: true
        run: |
          mkdir -p build/reports/detekt
          "detekt-dist/detekt-cli-${DETEKT_VERSION}/bin/detekt-cli" \
            --config detekt.yml \
            --build-upon-default-config \
            --input composeApp/src/commonMain/kotlin,composeApp/src/desktopMain/kotlin,composeApp/src/androidMain/kotlin,composeApp/src/iosMain/kotlin,composeApp/src/windowsMain/kotlin \
            --excludes '**/build/**' \
            --report sarif:build/reports/detekt/detekt.sarif \
            --report txt:build/reports/detekt/detekt.txt \
            --report html:build/reports/detekt/detekt.html
          echo "Écarts detekt : $(wc -l < build/reports/detekt/detekt.txt)"

      - name: Archiver le rapport detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-detekt
          path: build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # APK debug + Android Lint. Les tests ne sont PLUS exécutés ici :
  # `testDebugUnitTest` rejouait les 723 tests de commonTest déjà couverts par
  # `desktopTest` dans tests-jvm (même code commun, même JVM) — ~10 min de
  # runner pour aucune information nouvelle. Les seuls tests propres à Android
  # seraient des tests instrumentés (androidTest), absents du projet.
  # ---------------------------------------------------------------------------
  build-android:
    name: Android — APK debug + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Les mipmap/ic_launcher.png sont dans Git LFS : sans résolution,
          # AAPT2 échoue en lisant un pointeur texte à la place d'un PNG.
          lfs: true

      - name: Préparer le build
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ !contains(fromJSON('["main", "master", "revetBackUp"]'), github.ref_name) }}

      - name: Construire l'APK debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Android Lint
        # RAPPORT SEULEMENT pour l'instant : aucune baseline n'existe
        # (composeApp/build.gradle.kts n'a pas de bloc `lint {}`), le nombre
        # d'erreurs n'est pas connu. Une fois le premier rapport analysé :
        # générer `lint-baseline.xml`, ajouter `lint { baseline = file(...);
        # abortOnError = true }` au build et retirer `continue-on-error`.
        continue-on-error: true
        run: ./gradlew :composeApp:lintDebug --continue --stacktrace

      - name: Archiver le rapport Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-android-lint
          path: |
            composeApp/build/reports/lint-results-debug.html
            composeApp/build/reports/lint-results-debug.xml
            composeApp/build/reports/lint-results-debug.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Archiver l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: VetNutriMP-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # iOS : runner macOS facturé 10× — on ne le déclenche pas sur chaque PR.
  # Sur une PR, poser le label `ci:ios` pour forcer la compilation.
  # ---------------------------------------------------------------------------
  build-ios:
    name: iOS — compilation Kotlin/Native
    runs-on: macos-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'push' && github.ref_name == 'main' ||
      github.event_name == 'workflow_dispatch' && inputs.run_ios ||
      contains(github.event.pull_request.labels.*.name, 'ci:ios')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Préparer le build
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ !contains(fromJSON('["main", "master", "revetBackUp"]'), github.ref_name) }}

      - name: Compiler la cible iosSimulatorArm64
        # Compilation seule : le link du framework est nettement plus long et
        # n'apporte rien tant qu'on ne publie pas d'IPA depuis la CI.
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Tests sur simulateur iOS (iosSimulatorArm64Test)
        # Exécute commonTest + iosTest dans un simulateur : c'est le seul endroit
        # où les `actual` iOS (PlatformCrypto via CommonCrypto, fichiers, etc.)
        # sont réellement exercés. Le runner macos-latest est Apple Silicon et
        # embarque Xcode + simulateurs.
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Archiver les rapports de test iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-ios
          path: |
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Empaquetage Debian — hérité de build-deb.yml, désormais conditionné à des
  # tests verts. Restreint aux branches publiables : sur une branche de travail
  # l'artefact n'intéresse personne et coûte ~5 min de runner par push.
  # ---------------------------------------------------------------------------
  package-deb:
    name: Paquet Debian
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [tests-jvm, build-android]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' &&
      contains(fromJSON('["main", "master", "revetBackUp"]'), github.ref_name)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Préparer le build
        uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ !contains(fromJSON('["main", "master", "revetBackUp"]'), github.ref_name) }}

      - name: Construire le paquet Debian
        run: ./gradlew :composeApp:packageReleaseDeb --stacktrace

      - name: Vérifier que le runtime embarqué cible le x86-64 générique
        # Bloque la publication d'un .deb dont le runtime requiert AVX2
        # (crash "invalid opcode" sur les CPU d'avant 2013) — cf. incident
        # v3.2.40 documenté dans scripts/check_deb_runtime.sh.
        run: bash scripts/check_deb_runtime.sh

      - name: Archiver le .deb
        uses: actions/upload-artifact@v4
        with:
          name: VetNutriMP-deb
          path: composeApp/build/compose/binaries/main*/deb/*.deb
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Check unique à exiger dans la protection de branche : il agrège les jobs
  # ci-dessus, y compris ceux qui peuvent être ignorés (iOS, paquet Debian).
  # ---------------------------------------------------------------------------
  ci-status:
    name: Résultat CI
    runs-on: ubuntu-latest
    if: always()
    needs: [tests-jvm, build-android, build-ios, package-deb, detekt]
    steps:
      - name: Contrôler le résultat des jobs
        run: |
          declare -A results=(
            [tests-jvm]="${{ needs.tests-jvm.result }}"
            [build-android]="${{ needs.build-android.result }}"
            [build-ios]="${{ needs.build-ios.result }}"
            [package-deb]="${{ needs.package-deb.result }}"
          )
          # detekt est en rapport seul (continue-on-error) : il est listé pour
          # information mais ne conditionne pas le résultat tant que le seuil
          # n'est pas fixé dans detekt.yml.
          printf '%-15s %s (informatif)\n' "detekt" "${{ needs.detekt.result }}"
          status=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            printf '%-15s %s\n' "$job" "$result"
            # `skipped` est attendu : iOS hors main, paquet Debian sur PR.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Le job $job a terminé en '$result'."; status=1 ;;
            esac
          done
          exit $status
